<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập - Paradise Resort</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-content">
      <div class="logo">🌴 <span>Paradise</span> Resort</div>
      <a href="index.html" class="btn btn-outline">Về trang chủ</a>
    </div>
  </header>

  <div class="container" style="max-width: 450px; margin: 60px auto; background: #fff; padding: 35px; border-radius: 12px; box-shadow: var(--shadow);">
    <h2 style="text-align: center; margin-bottom: 25px;">Đăng Nhập</h2>
    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 15px;">
        <label>Email</label>
        <input type="email" id="logEmail" required placeholder="email@domain.com">
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <label>Mật khẩu</label>
        <input type="password" id="logPass" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng nhập</button>
      <p style="text-align: center; margin-top: 15px; font-size: 14px;">
        Chưa có tài khoản? <a href="register.html" style="color: var(--primary);">Đăng ký ngay</a>
      </p>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const users = JSON.parse(localStorage.getItem('resortUsers') || '[]');
      const email = document.getElementById('logEmail').value;
      const pass = btoa(document.getElementById('logPass').value);
      const found = users.find(u => u.email === email && u.pass === pass);
      if (found) {
        localStorage.setItem('currentUser', JSON.stringify({ name: found.name, email: found.email }));
        alert('Đăng nhập thành công! Chào mừng ' + found.name);
        window.location.href = 'index.html';
      } else {
        alert('Sai email hoặc mật khẩu!');
      }
    });
  </script>
</body>
</html>
